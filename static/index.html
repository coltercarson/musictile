<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101218" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)">
<meta name="color-scheme" content="dark light">
<title>Video Tile</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%236ea8ff'/%3E%3Cpath d='M8 20v-8M12 23V9M16 19v-6M20 24V8M24 18v-4' stroke='%23101218' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root {
  --bg: #101218; --surface: #191c24; --surface-2: #232733; --line: #2d3241;
  --text: #eceef3; --muted: #9aa1b2; --accent: #6ea8ff; --accent-ink: #0b1220;
  --clip: #ffb547; --danger: #ff6b6b; --ok: #4cd38a; --wave: #4a5164;
  --radius: 14px; --bar-h: 64px;
  --safe-b: max(env(safe-area-inset-bottom), 8px);
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root {
    --bg: #f5f6f8; --surface: #ffffff; --surface-2: #eceff4; --line: #dde1e8;
    --text: #151821; --muted: #5d6475; --accent: #2f6fe4; --accent-ink: #ffffff;
    --clip: #e08a00; --danger: #d93b3b; --ok: #1f9d55; --wave: #b9bfcc;
    color-scheme: light;
  }
}
*, *::before, *::after { box-sizing: border-box; min-width: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-tap-highlight-color: transparent;
}
body:has(dialog[open]) { overflow: hidden; }
main {
  max-width: 640px; margin: 0 auto;
  padding: max(16px, env(safe-area-inset-top)) 16px calc(var(--bar-h) + var(--safe-b) + 24px);
}
h1 { font-size: 22px; margin: 4px 0 16px; letter-spacing: -0.01em; }
h2 { font-size: 17px; margin: 0; }
p { margin: 0 0 12px; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.err { color: var(--danger); font-size: 14px; }
.ellip { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
[hidden] { display: none !important; }

/* controls */
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
.btn {
  min-height: 44px; padding: 0 16px; border-radius: 12px; border: 1px solid var(--line);
  background: var(--surface-2); display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  font-weight: 600; font-size: 15px; white-space: nowrap; touch-action: manipulation;
}
.btn:active { transform: scale(0.98); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.btn.ghost { background: transparent; border-color: transparent; color: var(--accent); padding: 0 8px; }
.btn.block { width: 100%; }
.btn.big { min-height: 52px; font-size: 16px; }
.btn:disabled { opacity: 0.45; transform: none; cursor: default; }
.icon-btn {
  width: 44px; height: 44px; flex: none; border-radius: 50%; border: 0; background: transparent;
  display: inline-grid; place-items: center; color: var(--muted);
}
.icon-btn:active { background: var(--surface-2); }
svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
input[type=text], input[type=url], input[type=search], input[type=password], input[type=number], select {
  width: 100%; min-height: 48px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--line);
  background: var(--surface); font-size: 16px;
}
input:focus-visible, select:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
label.field { display: block; margin-bottom: 12px; }
label.field > span { display: block; font-size: 14px; color: var(--muted); margin: 0 0 6px 2px; }
.row { display: flex; align-items: center; gap: 8px; }
.grow { flex: 1; }

/* segmented toggle */
.seg { display: flex; background: var(--surface-2); border-radius: 12px; padding: 4px; margin-bottom: 16px; }
.seg button {
  flex: 1; min-height: 44px; border: 0; border-radius: 9px; background: transparent; color: var(--muted); font-weight: 600; font-size: 15px;
}
.seg button[aria-pressed=true] { background: var(--surface); color: var(--text); box-shadow: 0 1px 3px #0003; }

/* source buttons */
.src {
  display: flex; align-items: center; gap: 16px; width: 100%; min-height: 84px; padding: 16px 18px; margin-bottom: 12px;
  border-radius: 18px; border: 1px solid var(--line); background: var(--surface); text-align: left;
}
.src svg { width: 30px; height: 30px; color: var(--accent); }
.src b { display: block; font-size: 18px; }
.src.on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }

/* lists */
.list { border-radius: var(--radius); background: var(--surface); border: 1px solid var(--line); overflow: hidden; }
.item {
  display: flex; align-items: center; gap: 12px; width: 100%; min-height: 60px; padding: 8px 10px 8px 14px;
  border: 0; border-top: 1px solid var(--line); background: transparent; text-align: left;
}
.item:first-child { border-top: 0; }
.item:active { background: var(--surface-2); }
.item .t { flex: 1; }
.item .t b { display: block; font-weight: 600; font-size: 15px; }
.item .t span { display: block; font-size: 13px; color: var(--muted); }
.item > svg { color: var(--muted); }
.add {
  width: 40px; height: 40px; flex: none; border-radius: 50%; display: grid; place-items: center;
  border: 1.5px solid var(--line); color: var(--muted);
}
.add.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.add svg { width: 20px; height: 20px; }
.list-head { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
.list-head h2 { flex: 1; }
.empty { padding: 28px 16px; text-align: center; color: var(--muted); }
.drop {
  position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; min-height: 160px;
  border: 2px dashed var(--line); border-radius: 18px; background: var(--surface); text-align: center; padding: 20px; margin-bottom: 16px;
}
.drop svg { width: 36px; height: 36px; color: var(--accent); }
.drop input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.drop:focus-within { border-color: var(--accent); }

/* clip cards */
.settings { display: flex; gap: 12px; margin-bottom: 16px; }
.settings label { flex: 1; margin: 0; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 12px; margin-bottom: 12px; }
.card-head { display: flex; align-items: center; gap: 12px; }
.card-head .t { flex: 1; }
.card-head .t b { display: block; font-size: 15px; }
.card-head .t span { display: block; font-size: 13px; color: var(--muted); }
.thumb {
  position: relative; width: 56px; height: 56px; flex: none; border-radius: 10px; overflow: hidden; padding: 0; border: 0; background: var(--surface-2);
}
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb i {
  position: absolute; right: 3px; bottom: 3px; width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center;
  background: #000a; color: #fff;
}
.thumb i svg { width: 12px; height: 12px; }
.wave { position: relative; margin: 12px 0 8px; height: 72px; border-radius: 10px; background: var(--surface-2); overflow: hidden; touch-action: pan-y; }
.wave canvas { display: block; width: 100%; height: 100%; }
.wave .ph { position: absolute; inset: 0; display: grid; place-items: center; font-size: 14px; color: var(--muted); pointer-events: none; }
.wave .tm {
  position: absolute; top: 4px; right: 6px; padding: 1px 6px; border-radius: 6px; background: var(--bg); opacity: 0.85;
  font-size: 12px; font-variant-numeric: tabular-nums; pointer-events: none;
}
.controls { display: flex; align-items: center; gap: 8px; }
.play { width: 48px; height: 48px; border-radius: 50%; border: 0; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; flex: none; }
.play svg { fill: currentColor; stroke: none; }
.play:disabled { opacity: 0.4; }
.chip {
  min-height: 44px; padding: 0 12px; border-radius: 22px; border: 1.5px solid var(--clip); background: transparent; color: var(--text);
  display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap;
}
.chip svg { width: 14px; height: 14px; color: var(--clip); }
.chip:disabled { opacity: 0.45; }
.status { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
.spin { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--line); border-top-color: var(--accent); animation: spin 0.8s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }
.card.failed { border-color: color-mix(in srgb, var(--danger) 45%, var(--line)); }

/* export */
.pill { font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 20px; background: var(--surface-2); color: var(--muted); white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; flex: none; }
.pill.done { color: var(--ok); }
.pill.failed { color: var(--danger); }
.summary { padding: 14px 16px; border-radius: var(--radius); background: var(--surface); border: 1px solid var(--line); margin-bottom: 12px; }
.summary b { font-size: 18px; display: block; }
.actions { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }

/* step bar */
nav.steps {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
  display: flex; justify-content: center;
  padding: 4px 8px var(--safe-b);
  background: color-mix(in srgb, var(--surface) 92%, transparent);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border-top: 1px solid var(--line);
}
nav.steps > div { display: flex; width: 100%; max-width: 640px; }
nav.steps button {
  flex: 1; height: 56px; border: 0; background: transparent; color: var(--muted); isolation: isolate;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  font-size: 12px; font-weight: 600; position: relative;
}
nav.steps button svg { width: 24px; height: 24px; }
nav.steps button[aria-current=step] { color: var(--accent); }
nav.steps button[aria-current=step]::before {
  content: ""; position: absolute; top: 3px; width: 60px; height: 32px; border-radius: 16px;
  background: color-mix(in srgb, var(--accent) 16%, transparent); z-index: -1;
}
.badge {
  position: absolute; top: 2px; left: calc(50% + 6px); min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px;
  background: var(--clip); color: #1a1200; font-size: 11px; line-height: 18px; text-align: center;
}

/* toast */
#toast {
  position: fixed; left: 16px; right: 16px; bottom: calc(var(--bar-h) + var(--safe-b) + 12px); z-index: 20;
  margin: 0 auto; max-width: 420px; padding: 12px 16px; border-radius: 12px;
  background: var(--text); color: var(--bg); font-size: 15px; text-align: center;
  opacity: 0; transform: translateY(8px); transition: opacity .2s, transform .2s; pointer-events: none;
}
#toast.show { opacity: 1; transform: none; }

/* cover sheet */
dialog#sheet {
  margin: auto 0 0; width: 100%; max-width: 100%; max-height: 88dvh; padding: 0;
  border: 0; border-radius: 20px 20px 0 0; background: var(--bg); color: var(--text);
  flex-direction: column;
}
dialog#sheet[open] { display: flex; }
dialog#sheet::backdrop { background: #0009; }
@media (min-width: 700px) { dialog#sheet { max-width: 640px; margin: auto auto 0; } }
.grab { width: 40px; height: 4px; border-radius: 2px; background: var(--line); margin: 8px auto 0; flex: none; }
.sheet-head { display: flex; align-items: center; gap: 12px; padding: 10px 8px 8px 16px; flex: none; }
.sheet-head .t { flex: 1; }
.sheet-head .t b { display: block; }
.sheet-head .t span { display: block; font-size: 13px; color: var(--muted); }
.sheet-tabs { padding: 0 16px; flex: none; }
.sheet-tabs .seg { margin-bottom: 12px; }
.sheet-body { overflow-y: auto; padding: 4px 16px calc(16px + var(--safe-b)); overscroll-behavior: contain; min-height: 240px; }
.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.tile { padding: 0; border: 0; background: transparent; text-align: left; }
.tile img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 10px; background: var(--surface-2); display: block; }
.tile span { display: block; font-size: 12px; margin-top: 4px; color: var(--muted); line-height: 1.3; }
.big-cover { width: 100%; max-width: 260px; aspect-ratio: 1; object-fit: cover; border-radius: 14px; display: block; margin: 0 auto 16px; background: var(--surface-2); }
.note { font-size: 14px; color: var(--muted); padding: 10px 12px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); margin-top: 12px; }
</style>
</head>
<body>
<main id="app"></main>

<nav class="steps" aria-label="Steps">
  <div>
    <button data-step="source"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/></svg>Source</button>
    <button data-step="pick"><svg viewBox="0 0 24 24"><path d="M4 6h11M4 12h11M4 18h7M19 15v6M16 18h6"/></svg>Pick</button>
    <button data-step="clips"><svg viewBox="0 0 24 24"><path d="M4 10v4M8 6v12M12 9v6M16 4v16M20 10v4"/></svg>Clips<span class="badge" hidden></span></button>
    <button data-step="export"><svg viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>Export</button>
  </div>
</nav>

<div id="toast" role="status" aria-live="polite"></div>
<dialog id="sheet" aria-label="Cover"></dialog>

<script src="mock.js"></script>
<script src="app.js"></script>
</body>
</html>
